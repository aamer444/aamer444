name: Generate contribution snake

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main, profile-preview]

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Dots go from empty to busiest day; colors match the profile's cyan/violet theme.
          outputs: |
            dist/github-snake.svg?color_snake=#7c3aed&color_dots=#ebedf0,#cffafe,#67e8f9,#8b5cf6,#5b21b6&color_dot_border=#00000014
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#f0abfc&color_dots=#161b22,#0e4f5c,#0891b2,#22d3ee,#a78bfa&color_dot_border=#ffffff0d

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
