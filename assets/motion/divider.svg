<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" width="1200" height="24" aria-hidden="true">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#67e8f9" stop-opacity="0"/>
      <stop offset=".5" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="11" width="1200" height="2" rx="1" fill="url(#g)" opacity=".35"/>
  <rect x="-200" y="10" width="200" height="4" rx="2" fill="#67e8f9">
    <animate attributeName="x" values="-200;1200" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.85;1" dur="4s" repeatCount="indefinite"/>
  </rect>
  <circle cx="600" cy="12" r="4" fill="#a78bfa"><animate attributeName="r" values="3;6;3" dur="2s" repeatCount="indefinite"/></circle>
